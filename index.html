<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Neon Rush - Overdrive Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #080811; color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
    canvas { background: linear-gradient(to bottom, #05050f, #120524); display: block; box-shadow: 0 0 30px rgba(0,240,255,0.3); border-radius: 8px; }
    #ui-overlay { position: absolute; top: 15px; width: 100%; max-width: 380px; display: flex; justify-content: space-between; padding: 0 20px; font-weight: bold; font-size: 1rem; text-shadow: 0 0 8px rgba(0,240,255,0.7); pointer-events: none; z-index: 5; }
    .menu-screen { position: absolute; background: rgba(8, 8, 17, 0.95); border: 2px solid #00f0ff; border-radius: 16px; padding: 25px; width: 90%; max-width: 380px; text-align: center; box-shadow: 0 0 25px rgba(0,240,255,0.4); display: none; z-index: 10; }
    h1 { color: #00f0ff; font-size: 1.8rem; margin-bottom: 8px; text-shadow: 0 0 12px rgba(0,240,255,0.8); }
    p { color: #aaa; font-size: 0.85rem; margin-bottom: 15px; }
    .btn { background: #00f0ff; color: #080811; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: bold; font-size: 0.95rem; cursor: pointer; margin-bottom: 8px; transition: 0.2s; box-shadow: 0 0 10px rgba(0,240,255,0.4); }
    .btn:active { transform: scale(0.97); }
    .btn-secondary { background: rgba(255,0,127,0.15); border: 1.5px solid #ff007f; color: #ff007f; box-shadow: 0 0 10px rgba(255,0,127,0.2); }
  </style>
</head>
<body>

  <div id="ui-overlay">
    <div id="scoreDisplay">SCORE: 0</div>
    <div id="hpDisplay" style="color: #00ff66;">❤️ 3</div>
    <div id="crystalsDisplay" style="color: #ff007f;">💎 0</div>
  </div>

  <!-- Menu Principal -->
  <div id="mainMenu" class="menu-screen" style="display: block;">
    <h1>⚡ NEON RUSH</h1>
    <p>Overdrive Edition</p>
    <button class="btn" onclick="startGame()">JOGAR</button>
    <button class="btn btn-secondary" onclick="window.location.href='https://nexa-business-chi.vercel.app'">VOLTAR À NEXA APPS</button>
  </div>

  <!-- Game Over -->
  <div id="gameOverMenu" class="menu-screen">
    <h1 style="color: #ff007f;">FIM DE JOGO</h1>
    <p id="finalStats">Pontuação: 0</p>
    <button class="btn" onclick="startGame()">JOGAR NOVAMENTE</button>
    <button class="btn btn-secondary" onclick="goHome()">MENU PRINCIPAL</button>
  </div>

  <canvas id="gameCanvas" width="380" height="550"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Web Audio API para efeitos sonoros sintéticos
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      
      if (type === 'jump') {
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
      } else if (type === 'crystal') {
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
      } else if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
      }
    }

    let gameState = "MENU";
    let score = 0;
    let hp = 3;
    let crystals = parseInt(localStorage.getItem("nr_crystals") || "0");
    let overdriveTimer = 0;

    let player = { x: 170, y: 440, w: 35, h: 50, vy: 0, gravity: 0.65, jump: -11, grounded: false };
    let obstacles = [];
    let drones = [];
    let items = [];
    let particles = [];
    let frameCount = 0;

    function startGame() {
      document.querySelectorAll('.menu-screen').forEach(m => m.style.display = 'none');
      gameState = "PLAYING";
      score = 0;
      hp = 3;
      obstacles = [];
      drones = [];
      items = [];
      particles = [];
      player.y = 440;
      player.vy = 0;
      overdriveTimer = 0;
    }

    function goHome() {
      document.querySelectorAll('.menu-screen').forEach(m => m.style.display = 'none');
      document.getElementById('mainMenu').style.display = 'block';
      gameState = "MENU";
    }

    window.addEventListener('touchstart', () => {
      if (gameState === "PLAYING" && player.grounded) {
        player.vy = player.jump;
        player.grounded = false;
        playSound('jump');
        for(let i=0; i<6; i++) particles.push({x: player.x + 15, y: player.y + 50, vx: (Math.random()-0.5)*4, vy: Math.random()*2, color: '#00f0ff', life: 15});
      }
    });

    function update() {
      if (gameState !== "PLAYING") return;

      frameCount++;
      score += (overdriveTimer > 0 ? 3 : 1);
      if (overdriveTimer > 0) overdriveTimer--;

      player.vy += player.gravity;
      player.y += player.vy;
      if (player.y > 440) { player.y = 440; player.vy = 0; player.grounded = true; }

      // Spawner de Obstáculos no Chão
      if (frameCount % 80 === 0) {
        obstacles.push({ x: Math.floor(Math.random()*3) * 100 + 40, y: -40, w: 35, h: 35, speed: 5.5 });
      }

      // Spawner de Drones Aéreos (Nova Função)
      if (frameCount % 150 === 0) {
        drones.push({ x: -30, y: 320, w: 40, h: 20, speed: 4, dir: 1 });
      }

      // Spawner de Cristais e Overdrive
      if (frameCount % 100 === 0) {
        items.push({ x: Math.floor(Math.random()*3) * 100 + 45, y: -30, w: 22, h: 22, type: Math.random() > 0.2 ? 'crystal' : 'overdrive' });
      }

      // Atualizar Obstáculos
      for (let i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].y += obstacles[i].speed;
        if (player.x < obstacles[i].x + obstacles[i].w && player.x + player.w > obstacles[i].x &&
            player.y < obstacles[i].y + obstacles[i].h && player.y + player.h > obstacles[i].y) {
          handleDamage();
          obstacles.splice(i, 1);
        }
        if (obstacles[i] && obstacles[i].y > 550) obstacles.splice(i, 1);
      }

      // Atualizar Drones Aéreos
      for (let i = drones.length - 1; i >= 0; i--) {
        drones[i].x += drones[i].speed * drones[i].dir;
        if (drones[i].x > canvas.width || drones[i].x < 0) drones[i].dir *= -1;
        
        if (player.x < drones[i].x + drones[i].w && player.x + player.w > drones[i].x &&
            player.y < drones[i].y + drones[i].h && player.y + player.h > drones[i].y) {
          handleDamage();
          drones.splice(i, 1);
        }
      }

      // Atualizar Itens
      for (let i = items.length - 1; i >= 0; i--) {
        items[i].y += 5;
        if (player.x < items[i].x + items[i].w && player.x + player.w > items[i].x &&
            player.y < items[i].y + items[i].h && player.y + player.h > items[i].y) {
          if (items[i].type === 'crystal') {
            crystals += 5;
            localStorage.setItem("nr_crystals", crystals);
            playSound('crystal');
          } else {
            overdriveTimer = 300; // 5 segundos de invencibilidade/pontuação tripla
          }
          items.splice(i, 1);
        }
        if (items[i] && items[i].y > 550) items.splice(i, 1);
      }

      document.getElementById("scoreDisplay").innerText = "SCORE: " + score;
      document.getElementById("hpDisplay").innerText = "❤️ " + hp;
      document.getElementById("crystalsDisplay").innerText = "💎 " + crystals;
    }

    function handleDamage() {
      if (overdriveTimer > 0) return; // Invulnerável no Overdrive
      hp--;
      playSound('hit');
      if (hp <= 0) {
        gameOver();
      }
    }

    function gameOver() {
      gameState = "GAMEOVER";
      document.getElementById("finalStats").innerText = "Pontuação Final: " + score;
      document.getElementById("gameOverMenu").style.display = "block";
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Player com cor de Overdrive ou Normal
      ctx.fillStyle = overdriveTimer > 0 ? "#ffe600" : "#00f0ff";
      ctx.shadowColor = ctx.fillStyle;
      ctx.shadowBlur = overdriveTimer > 0 ? 20 : 12;
      ctx.fillRect(player.x, player.y, player.w, player.h);
      ctx.shadowBlur = 0;

      // Obstáculos Chão
      ctx.fillStyle = "#ff007f";
      ctx.shadowColor = "#ff007f";
      ctx.shadowBlur = 10;
      obstacles.forEach(o => ctx.fillRect(o.x, o.y, o.w, o.h));
      ctx.shadowBlur = 0;

      // Drones Aéreos
      ctx.fillStyle = "#ff9900";
      drones.forEach(d => ctx.fillRect(d.x, d.y, d.w, d.h));

      // Itens (Cristais / Overdrive)
      items.forEach(it => {
        ctx.fillStyle = it.type === 'crystal' ? '#00f0ff' : '#ffe600';
        ctx.fillRect(it.x, it.y, it.w, it.h);
      });
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
